# OSF-UI nginx config – SPA routing, localized (en/de/fr)
# Served on port 80 inside container; map to 8080 on host for RPi

map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    # Do NOT long-cache JSON: shopfloor_layout.json must refresh after deploy
    # (stale layout without fts[] hid AGV-1/AGV-2 on RPi while localhost was fine).
    application/json           epoch;
    application/javascript     max;
    ~image/                    max;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    set $lang en;

    if ($http_accept_language ~* "^de") {
        set $lang de;
    }
    if ($http_accept_language ~* "^fr") {
        set $lang fr;
    }
    if ($http_accept_language ~* "^en") {
        set $lang en;
    }

    # / -> redirect to locale
    location = / {
        return 302 $scheme://$http_host/$lang/;
    }

    # SPA fallback for locale routes (/en, /en/, /en/dsp, ...)
    location ~ ^/(en|de|fr)(/.*)?$ {
        set $locale $1;
        try_files $uri $uri/ /$locale/index.html =404;
    }

    # Shopfloor layout — never long-cache (serial↔module registry incl. fts[])
    location ~* /shopfloor/shopfloor_layout\.json$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires epoch;
    }

    # Assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000";
    }

    location /locale/ {
        add_header Cache-Control "public, max-age=3600";
    }

    expires $expires;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
