# DSP-Edge VE .201 — Grafana + Persistence only (SQL = existing rittal_sqlserver).
# Usage on the VE:
#   cp env.dsp .env
#   docker compose -f docker-compose.dsp.yml up -d --build
#
# Does NOT start a local SQL container. Reach host-published :1433 via host.docker.internal.

services:
  grafana:
    image: grafana/grafana:latest
    container_name: osf-edge-grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/home.json
      MSSQL_DB: ${MSSQL_DB:-osf_edge}
      MSSQL_USER: ${MSSQL_USER:-osf_edge}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      MSSQL_GRAFANA_URL: ${MSSQL_GRAFANA_URL:-host.docker.internal:1433}
    ports:
      - "${GRAFANA_EXTERNAL_PORT:-3000}:3000"
    volumes:
      - osf_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  persistence-service:
    build:
      context: ./services/persistence-service
    container_name: osf-edge-persistence-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID}
      MSSQL_HOST: ${MSSQL_HOST:-host.docker.internal}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_DB: ${MSSQL_DB:-osf_edge}
      MSSQL_USER: ${MSSQL_USER:-osf_edge}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      MSSQL_ENCRYPT: ${MSSQL_ENCRYPT:-false}
      MSSQL_TRUST_SERVER_CERTIFICATE: ${MSSQL_TRUST_SERVER_CERTIFICATE:-true}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS}
      SENSOR_INTERVAL_SECONDS: ${SENSOR_INTERVAL_SECONDS}
      SENSOR_IDLE_INTERVAL_SECONDS: ${SENSOR_IDLE_INTERVAL_SECONDS}
      ENABLE_RAW_MESSAGES: ${ENABLE_RAW_MESSAGES}
      ENABLE_CAMERA_TOPIC: ${ENABLE_CAMERA_TOPIC}
      LOG_LEVEL: ${LOG_LEVEL}
      PERSISTENCE_MODE: ${PERSISTENCE_MODE:-live}
      QUERY_API_ENABLED: ${QUERY_API_ENABLED:-true}
      QUERY_API_PORT: "3081"
      QUERY_API_CORS_ORIGIN: ${QUERY_API_CORS_ORIGIN:-*}
    ports:
      - "${QUERY_API_EXTERNAL_PORT:-3081}:3081"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  osf_grafana_data:
