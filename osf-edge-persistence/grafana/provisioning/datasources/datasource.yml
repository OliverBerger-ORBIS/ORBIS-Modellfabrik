apiVersion: 1

datasources:
  # SQL Server — same dialect as DSP .201
  # Note: Grafana provisioning supports ${VAR} only (no bash :-defaults).
  - name: OSF SQL Server
    uid: POSFMSQL001
    type: mssql
    access: proxy
    isDefault: true
    url: ${MSSQL_GRAFANA_URL}
    user: ${MSSQL_USER}
    jsonData:
      database: ${MSSQL_DB}
      maxOpenConns: 10
      maxIdleConns: 10
      connMaxLifetime: 14400
      encrypt: "false"
    secureJsonData:
      password: ${MSSQL_PASSWORD}
    editable: false
    version: 4
